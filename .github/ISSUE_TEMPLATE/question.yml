name: Ask a question or suggest an improvement
description: Tell us what you want to explore.
body:
  - type: markdown
    attributes:
      value: "New to spectroscopy? Questions are welcome. Please keep personal information and credentials out of public posts."
  - type: textarea
    id: question
    attributes:
      label: Your question or idea
      description: What would you like to understand or do with SpectraCave?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Helpful context
      description: Your setup, experience level, and what you have tried, if relevant.
